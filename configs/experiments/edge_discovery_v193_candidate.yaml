experiment:
  id: edge_discovery_v193_candidate
  schema_version: 5
  source_config: configs/he_chuyen_gia_latest_ui_v193.yaml
  clone_only: true
  bridge_input_count: 137
  bridge_output_count: 20
  artifact_version: 18

app_overrides:
  # Candidate truc tiep chi danh gia nhanh co dinh. PPO chi duoc bat boi
  # run_mt5_ablation_v193.py sau khi nhanh nay co can duoi loi nhuan duong.
  mt5_learning_enabled: false

learning_overrides:
  # V193 seed va bo nhan V16 deu duoc hoc tren 137 gia tri thô. EA chi gui
  # gia tri thô; giu cung che do o candidate de khong doi phan bo dau vao
  # giua hoc offline va duong chay MT5.
  input_normalization_mode: raw
  five_behavior_uniform_mix: 0.15
  # Teacher labels one structural entry through its opposite-pivot lifecycle.
  # Do not stack another entry before the current position/pending order settles.
  entry_guard_single_position: true
  # Apply a hard veto only when the current CTX_CHUNG prototype has enough
  # policy-origin evidence and its action LCB is materially negative.  Keep
  # aggregate fallback off so evidence from another market state cannot turn
  # into a global no-trade rule.
  context_expectancy_entry_gate_enabled: true
  context_expectancy_entry_gate_min_support: 12.0
  context_expectancy_entry_gate_max_lcb: -0.15
  context_expectancy_entry_gate_allowed_contexts: [CTX_CHUNG]
  context_expectancy_entry_gate_scope_fallback_enabled: false
  # Sparse MT5 events previously made gamma approximately zero. Preserve at
  # least sixteen economic decisions in the GAE horizon.
  five_gae_min_feedback_steps: 16
  # Four-step path batches give this bounded MT5 window multiple ranking
  # optimizer updates instead of leaving most mature anchors queued behind a
  # 64-step threshold. This is candidate-only; the runtime PPO model stays at 64.
  five_pattern_unroll: 4
  # Keep every legal entry represented without forcing the six-entry group to
  # own 60% of behavior probability.  0.5% per entry preserves discovery.
  # Reward/expectancy never attenuates global exploration; proven failures are
  # suppressed only at their stored causal state-agent-action anchor.
  five_behavior_entry_probability_floor: 0.005
  five_flat_entry_mass_floor_start: 0.15
  five_flat_entry_mass_floor_end: 0.0
  # Match the teacher's selective entry prior; negative MT5 expectancy can
  # attenuate this floor while entropy still explores unseen states.
  five_flat_entry_mass_loss_weight: 2.0
  # Candidate-only A/B: the inherited seed emits MANAGE/CLOSE while flat;
  # make that invalid command materially more expensive without changing the
  # production UI configuration or lifecycle reward.
  five_invalid_position_action_no_position_penalty_r: 2.0
  five_lifecycle_initial_sl_local_loss_weight: 1.0
  # Five-style anti-forgetting for trading: a material losing entry context is
  # kept in a persistent bank and re-forwarded through the CURRENT policy on
  # later lifecycle batches. It stops training only after the failed action
  # probability stays <=8% for 3 audits; a later regression >=14% reopens it.
  five_failure_replay_enabled: true
  five_failure_replay_capacity: 256
  five_failure_replay_items_per_batch: 8
  five_failure_replay_audit_items: 32
  five_failure_replay_weight: 0.35
  five_failure_replay_admit_threshold_r: -0.25
  five_failure_replay_repair_probability: 0.08
  five_failure_replay_reopen_probability: 0.14
  five_failure_replay_repair_streak: 3
  five_failure_replay_audit_interval: 8
  # A smoke gate needs bounded anti-forgetting evidence. Twelve sessions made
  # one short run spend most of its wall time replaying 137 already-negative
  # cases; four retains one pre + three post replay transactions. A promoted
  # long-run profile can raise this after the short gate passes.
  five_mt5_failure_replay_sessions_per_run: 4
  # Signed counterfactual quality shaping, separate from lifecycle economic R.
  # It gives sampled good entries positive credit and bad entries negative
  # credit; the public UI configuration leaves this at zero.
  five_pattern_action_quality_reward_scale_r: 0.10
  five_entropy_start: 0.06
  five_entropy_edge_gate_enabled: true
  five_entropy_edge_release_count: 3
  five_entropy_edge_decay_count: 8
  five_action_ranking_delta_r: 0.05
  five_action_ranking_margin_scale: 0.50
  five_action_ranking_margin_min: 0.05
  five_action_ranking_margin_max: 1.00
  # Counterfactual path ranking is the direct signal that separates the six
  # entry styles; strengthen it after the sampler A/B exposed bad market-entry
  # actions, while lifecycle economic reward remains unchanged.
  five_action_ranking_loss_weight: 2.0
  five_invalid_cancel_no_pending_penalty_r: 2.0
  five_unfilled_pending_timeout_penalty_r: 0.25
  execution_trace_observatory_max_bytes: 67108864
  # The paired profit gate needs actions, receipts and lifecycle PnL, not a
  # 4096-value recurrent dump on every decision. Keeping that dump disabled
  # avoids making frozen MT5 evaluation I/O-bound without changing inference.
  execution_trace_observatory_include_recurrent_state: false

label_contract:
  immutable_counterfactual_path: 48-M1
  sparse_return_horizons_minutes: [20, 60, 240, 360, 600]
  regime_transition_m15_horizons: [8, 16, 24, 32]
  delayed_targets_only: true

gradient_contract:
  curriculum: edge_discovery_v1
  entry_lifecycle_actor_rows_0_6: trainable
  timing_gate: disabled
  conditional_entry_ranking: trainable
  sole_writer: five_ppo_adam

isolation:
  sequential_only: true
  # Quota 12 GiB chi ap dung cho payload moi sinh (checkpoint + telemetry).
  # Checkpoint Five hien tai da vuot 8 GiB; preflight tu choi truoc khi chay neu
  # seed x 1.25 + telemetry van vuot quota nay.
  # Ban sao seed bat bien duoc bao ve va khong bi tinh nham vao quota payload;
  # reserve floor van kiem tra dung luong dia thuc cua ca hai tep.
  candidate_output_quota_bytes: 12884901888
  # 1.5 GiB van la hard floor trong luc chay; projected payload da cong them
  # 25% tren kich thuoc seed nen khong can giu lap 2.5 GiB lan nua.
  reserve_floor_bytes: 1610612736
  event_jsonl_max_bytes: 33554432
  execution_trace_max_bytes: 67108864
  preserve_source_seed: true
  preserve_source_model: true
  preserve_source_config: true
