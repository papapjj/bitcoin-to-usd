experiment:
  id: sgt_compact_tier2_candidate
  schema_version: 1
  source_config: configs/he_chuyen_gia_reasoning_rl_v1_candidate.yaml
  clone_only: true
  bridge_input_count: 137
  bridge_output_count: 20
  artifact_version: 1

# SGT-V193-Compact Sequence Core (xLSTM 17.5M) with Tier 1 & Tier 2 Enhancements
# Active Candidate Profile for MT5 Edge Discovery
app_overrides:
  mt5_learning_enabled: true

learning_overrides:
  # Tier 1 & Tier 2 Core Activations
  tier2_compact_core_enabled: true
  tier1_vicreg_regularizer_enabled: true
  tier1_reservoir_buffer_enabled: true
  tier1_ewc_enabled: true
  tier2_coma_enabled: true
  tier2_rnd_enabled: true

  # Policy Core Settings
  five_reasoning_rl_enabled: false
  five_reasoning_steps: 3
  five_reasoning_group_size: 8
  five_reasoning_encoder_credit_scale: 0.0
  five_reasoning_action_scale: 0.0
  five_reasoning_action_residual_clip: 0.25
  five_pattern_reward_enabled: true
  # Lock Non-Entry Owners (Agents 2, 3, 4) to HOLD so Portfolio Governor
  # cannot liquidate positions prematurely; let fixed barriers TP/SL govern exits.
  five_lock_non_entry_to_hold: true
  five_fixed_geometry_enabled: true
  context_direction_entry_gate_enabled: false
  five_unfilled_pending_timeout_penalty_r: 0.0
  five_rlhf_allow_optimizer_state_reinitialization_for_research: true
  five_rlhf_recovery_snapshot_interval_updates: 8
  five_pattern_unroll: 4
  # Minimize uniform random noise on M1 to stop spread bleeding and false entries.
  five_behavior_uniform_mix: 0.02
  five_behavior_entry_probability_floor: 0.005
  five_action_ranking_bidirectional_enabled: true
  five_action_ranking_min_qualified_entries: 2
  five_expectancy_action_veto_enabled: true
  five_expectancy_action_veto_min_samples: 6
  five_expectancy_action_veto_min_confidence: 0.20
  five_expectancy_action_veto_min_lcb_r: -0.15
  five_expectancy_action_veto_hold_owner_on_negative: false
  five_live_action_veto_enabled: true
  five_live_action_veto_min_samples: 6
  five_live_action_veto_min_confidence: 0.20
  five_live_action_veto_min_lcb_r: -0.15
  five_live_action_veto_hold_owner_on_negative: false
  five_live_action_veto_probe_enabled: true
  five_live_action_veto_probe_on_negative_transition: true
  five_live_action_veto_probe_interval_decisions: 16
  five_live_owner_exploration_enabled: true
  five_live_owner_exploration_min_samples: 6
  five_live_owner_exploration_min_confidence: 0.20
  five_live_owner_exploration_min_lcb_r: -0.15
  five_live_owner_exploration_min_mix: 0.02
  five_live_owner_bootstrap_probe_enabled: false
  five_live_owner_bootstrap_probe_interval_decisions: 16
  five_live_owner_bootstrap_probe_max_per_run: 0
  five_live_owner_bootstrap_probe_force_market: false
  five_flat_entry_mass_floor_start: 0.15
  five_flat_entry_mass_floor_end: 0.0
  five_pattern_action_quality_reward_scale_r: 0.10
  execution_trace_observatory_include_recurrent_state: false

order_overrides:
  timeframe: M1
  pending_expiry_bars: 30
  max_holding_bars: 120
  fixed_sl_atr: 5.0
  fixed_tp_atr: 10.0

label_contract:
  immutable_counterfactual_path: 48-M1
  delayed_targets_only: true

gradient_contract:
  curriculum: sgt_compact_tier2_active
  reasoning_head: trainable
  encoder_credit: 0.0
  action_residual_scale: 0.0
  sole_writer: five_ppo_adam

isolation:
  sequential_only: true
  candidate_output_quota_bytes: 12884901888
  reserve_floor_bytes: 1610612736
  event_jsonl_max_bytes: 33554432
  execution_trace_max_bytes: 67108864
  preserve_source_seed: true
