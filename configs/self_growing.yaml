model:
  type: self_growing_graph_cognitive_policy
  input_count: 137
  output_count: 20
  initial_modules: 1
  hidden_size: 560
  hidden_layers: 10
  max_modules: 50
  mutation_sigma: 0.08
supernetwork:
  m1_backend: direct_rnn
  enable_child_supernet: true
  max_child_networks: 4
  max_generation: 2
  max_children_per_network: 50
  diversity_threshold: 0.05
  cross_module_enabled: true
  max_cross_module_edges: 96
  max_m1_module_edges: 96
  max_cross_module_recurrent_edges: 64
  max_cross_module_lateral_edges: 64
  recurrent_loop_limit: 96
  max_graph_neurons: 512
  max_graph_connections: 16384
  max_hidden_neurons_per_module: 512
  max_hidden_layers_per_module: 24
  hidden_depth_growth_threshold: 0.55
  allowed_cross_module_edge_kinds:
  - forward
  - recurrent
  - lateral
  - memory
  - predictive
  - critic
  - selector
  - gating
  - plastic
  - meta
  allowed_module_to_m1_targets:
  - encoder
  - memory
  - hypothesis
  - predictor
  - critic
  - selector
  - meta
  - output
  allowed_m1_to_module_targets:
  - encoder
  - memory
  - hypothesis
  - predictor
  - critic
  - selector
  - meta
  - output
  allowed_specialist_roles: []
  flexible_cross_module_connectivity: true
  flexible_connection_fanout: 16
  flexible_peer_module_fanout: 16
  module_role_budget: 4
  prediction_need_threshold: 0.35
  memory_need_threshold: 0.35
  risk_need_threshold: 0.35
  position_need_threshold: 0.35
  cadence_need_threshold: 0.35
  role_cooldown: 2
  require_mt5_promotion: true
  trial_history_path: outputs/supernetwork_trial_history.jsonl
  enable_trial_micro_growth: true
  micro_growth_max_neurons_per_trial: 8
  micro_growth_learning_threshold: 0.35
  micro_growth_initial_gate: -4.0
  micro_growth_initial_weight: 0.025
  micro_growth_survival_contexts: 3
  micro_growth_survival_similar_outcomes: 3
  micro_growth_context_similarity_threshold: 0.82
  micro_growth_context_prototype_lr: 0.08
  micro_growth_survival_positive_supports: 3
  micro_growth_survival_utility: 0.03
  micro_growth_consolidate_utility: 0.2
  micro_growth_fade_rate: 0.92
  micro_growth_prune_fade_threshold: 0.22
  micro_growth_grace_outcomes: 5
  micro_growth_max_modules_per_trial: 1
  specialist_module_initial_gate: -2.15
  specialist_module_initial_weight: 0.055
  specialist_module_input_adapters: 3
  specialist_module_core_neurons: 4
  specialist_module_output_adapters: 2
  specialist_module_enable_bypass_interfaces: true
  specialist_min_causal_confidence_to_activate: 0.55
  specialist_require_causal_validation_to_consolidate: true
expectancy:
  enabled: true
  min_samples: 6
  merge_similarity: 0.9
  max_samples_per_context: 256
  min_policy_origin_ratio: 0.6
  promotion_lcb_min_delta: 0.01
causal:
  enabled: true
  replay_request_path: outputs/causal_replay_requests.jsonl
  replay_result_path: outputs/causal_replay_results.jsonl
  max_decisions: 4096
  max_reports: 4096
  require_verified_replay: true
continuous:
  enabled: true
  session_root: outputs/continuous
  post_exit_bars: 20
  max_lifecycle_wait_sequences: 32
  checkpoint_every_closed_positions: 5
  checkpoint_every_minutes: 15
  max_event_bytes: 134217728
  min_independent_evidence: 3
  min_verified_replays_to_create_module: 2
  min_verified_replays_to_activate_module: 3
  min_verified_replays_to_consolidate_module: 6
  min_causal_confidence: 0.65
  max_probation_modules: 12
  max_active_modules: 24
  max_modules_per_context_cause: 1
  max_modules_per_decision: 3
  max_total_action_bias: 0.2
  min_independent_evidence_to_inhibit: 3
  min_verified_replays_to_inhibit: 2
  local_inhibition_min_similarity: 0.9
  local_inhibition_max_strength: 0.12
  local_inhibition_half_life_positions: 80
  trade_funnel_emit_every_decisions: 16
  trade_activity_warning_after_decisions: 48
  pending_cancel_after_decisions: 12
  pending_cancel_interval_decisions: 4
  enable_local_inhibition: true
  enable_persistent_specialists: true
  migrate_legacy_trade_activity: true
  legacy_risk_gate_rebase_factor: 0.15
  legacy_output_hold_rebase_factor: 0.2
  risk_gate_entry_dampen_max: 0.08
  inactivity_recalibration_after_decisions: 48
  inactivity_risk_gate_dampen_cap: 0.02
  require_execution_action_attribution: true
  exclude_hold_from_neural_selection: false
  flat_idle_is_non_feedback: true
  suppress_flat_idle_starvation: true

learning:
  seed: 20260629
  require_real_ticks_for_promotion: true
  # V8: reject promotion when the tester report lacks fresh real-tick evidence.
  require_real_tick_evidence_for_promotion: true
  frozen_oos: true
  # V8: uncertainty can request shadow/replay work, never live entry.
  live_curiosity_mode: shadow_only
  session_timezone: UTC
  mt5_server_utc_offset_hours: 0
  spread_semantics: ask_minus_bid_price
  experience_buffer_max: 4096
  rejection_memory_max: 2048
  execution_trace_cache_max: 8192
  memory_neurons_max: 4096
  memory_connections_max: 16384
  mistake_episodes_max: 2048
  promotion_min_oos_windows: 3
  promotion_min_seeds: 3
